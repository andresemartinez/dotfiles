set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:RGB,xterm*:extkeys'
set -g history-limit 50000
set -g display-time 4000

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Better claude code support
set -g allow-passthrough on
set -s extended-keys on

set -g base-index 1
set -g pane-base-index 1
set -wg pane-base-index 1
set -g renumber-windows on

set -g mouse on

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Theme
set -g @catppuccin_flavor "macchiato"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left "#{E:@catppuccin_status_session}#[bg=default] "
set -g status-left-length 100

set -g status-right ""
set -g status-right-length 100


# Switch to another session on destroy (instead of detaching)
set -g detach-on-destroy off
bind q confirm-before -p "kill session '#S' (#{session_windows} windows)? (y/n)" kill-session

# Vim like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind -r L switch-client -l

# Vim like Copy & Copy to Clipboard
set -g set-clipboard on
set -wg mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind p run "pbpaste | tmux load-buffer - ; tmux paste-buffer"

# Keep path on window split
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Sessionizer
bind f run-shell "tmux neww ~/.config/tmux/scripts/tmux-sessionizer"

# New named session, rooted at the current pane's path
bind N command-prompt -p "new session:" "new-session -d -s '%1' -c '#{pane_current_path}' ; switch-client -t '%1'"

# Neovim recommendations
set -sg escape-time 10
set -g focus-events on
